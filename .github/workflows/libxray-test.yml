name: libXray tests

on:
  push:
  pull_request:

jobs:
  test:
    # Our runner (build-cores.yml); a pull request from a fork keeps GitHub's image.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'libxray' }}
    permissions:
      contents: read
    steps:
      # go.mod replaces xray-core with ../xray-core: the fork with the dialer-proxy
      # balancer and the defused date checks, at the commit in xray-core.ref (the
      # same one build-cores.yml builds). Both repositories sit side by side.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: libXray

      - name: Read xray-core.ref
        id: xray
        run: |
          ref="$(tr -d '[:space:]' < libXray/xray-core.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "xray-core.ref is not a full SHA: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the xray-core fork
        uses: actions/checkout@v6
        with:
          repository: Romaxa55/Xray-core
          ref: ${{ steps.xray.outputs.ref }}
          path: xray-core

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: libXray/go.mod
          cache-dependency-path: libXray/go.sum

      - name: No date-gated failures in the fork
        run: libXray/scripts/check-no-timebomb.sh xray-core

      - name: Go test
        working-directory: libXray
        run: go test ./... -count=1 -timeout 15m
